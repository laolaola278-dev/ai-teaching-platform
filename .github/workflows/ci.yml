name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        ports: ["5432:5432"]
        env:
          POSTGRES_DB: ai_teaching_platform
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_teaching_platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend dependencies for tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio httpx SQLAlchemy
          # If there are test-only requirements, install them here
      - name: Lint with Ruff
        run: |
          python -m pip install ruff
          npx -v >/dev/null 2>&1 || true
          ruff check backend/ frontend/ || true
      - name: Type check with mypy
        run: |
          python -m pip install mypy
          mypy backend/ || true
      - name: Migration sanity check
        run: |
          python backend/scripts/migration_validation.py
      - name: Bandit HTML report
        run: |
          python -m pip install bandit
          bandit -r backend/ -f html -o bandit-report.html
      - name: Upload Bandit report
        uses: actions/upload-artifact@v3
        with:
          name: bandit-report
          path: bandit-report.html
      - name: Migration smoke test (production style)
        run: |
          python backend/scripts/migration_validation.py
      - name: Run backend tests
        run: |
          pytest backend/tests -q
      - name: Lint & Type check (ruff/mypy)
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit
          ruff check backend/ frontend/
          mypy backend/ frontend/
      - name: Security scan (Bandit)
        run: |
          bandit -r backend/

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Build frontend
        run: |
          cd frontend
          npm run build

  migration_validation_ci:
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      postgres:
        image: postgres:15
        ports: ["5433:5432"]
        env:
          POSTGRES_DB: ai_teaching_platform_mig
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
      - name: Run migration validation against test DB
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/ai_teaching_platform_mig
        run: |
          python backend/scripts/migration_validation.py

  # Optional: a combined workflow could also run linting, type checks, and packaging
