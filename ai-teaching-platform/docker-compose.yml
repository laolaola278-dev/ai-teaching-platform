version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai-teaching-platform-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_teaching_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-teaching-network

  redis:
    image: redis:7-alpine
    container_name: ai-teaching-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-teaching-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-teaching-platform-backend
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ai_teaching_platform
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEBUG=false
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - uploads:/app/uploads
    networks:
      - ai-teaching-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-teaching-platform-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ai-teaching-network

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-teaching-platform-celery-worker
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ai_teaching_platform
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: uv run celery -A app.core.celery worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend/app:/app/app
      - uploads:/app/uploads
    networks:
      - ai-teaching-network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-teaching-platform-celery-beat
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ai_teaching_platform
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: uv run celery -A app.core.celery beat --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend/app:/app/app
    networks:
      - ai-teaching-network

volumes:
  postgres_data:
  redis_data:
  uploads:

networks:
  ai-teaching-network:
    driver: bridge